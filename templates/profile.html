{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">YOUR ACCOUNT</p><h1>Profile & settings</h1><p class="muted">Make your study space work for you.</p></div></div><form class="panel stack profile-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Personal details</h2><label>Name<input name="name" value="{{ current_user.name }}" required minlength="2" maxlength="100"></label><label>Email address<input value="{{ current_user.email }}" disabled></label><label>Preferred study hours per day<input name="preferred_hours" type="number" min="1" max="16" value="{{ current_user.preferred_hours }}" required></label><button class="button primary">Save changes →</button></form>{% endblock %}
